<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>AUROR</title><link rel="stylesheet" href="css/tokens.css">
<style>html,body{margin:0;padding:0}body{width:1280px;height:854px;display:grid;grid-template-columns:1fr 320px;font-family:var(--auror-font)}.mark{background:var(--auror-brand);display:flex;align-items:center;justify-content:center}.mark span{font-size:210px;font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--auror-ink)}.strip{display:grid;grid-template-rows:repeat(4,1fr)}</style>
</head><body>
<div class="mark"><span>AUROR</span></div>
<div class="strip"><div style="background:var(--auror-fern)"></div><div style="background:var(--auror-clay)"></div><div style="background:var(--auror-river)"></div><div style="background:var(--auror-amethyst)"></div></div>
</body></html>
